function rhythmPanel(b){if(!b.rhythm?.points)return '';return `<h2>配乐与动作卡点</h2><p class="notice issue">原曲区间已实际剪入试听版；原曲秒数可追溯。瞬态测量只是候选，乐句与情绪卡点仍需试听。</p><p>${esc(b.rhythm.note)}</p><div class="scroll"><table><thead><tr><th>批内／成片秒</th><th>动作落点</th><th>音乐处理</th><th>原曲位置</th></tr></thead><tbody>${b.rhythm.points.map(p=>`<tr><td>${n(p.time)} / ${n(p.film_time)}</td><td>${esc(p.action_zh)}</td><td>${esc(p.music_intent)}</td><td>${p.source_seconds==null?'停乐 · 拟音落点':esc(musicLabel(p.music_id))+' · '+n(p.source_seconds)+'秒'}</td></tr>`).join('')}</tbody></table></div><p class="muted">跨批音乐按成片时间连续；每批末尾剪除余量不计入音乐时间。正式配乐不上传，也不让模型生成。</p>`;}
function render(){nav();document.querySelector('#view-batch').setAttribute('aria-pressed',String(!dialogueView));document.querySelector('#view-dialogue').setAttribute('aria-pressed',String(dialogueView));if(dialogueView){renderDialogueReading();return;}let b=D.batches[index];model=b.selected_model;document.querySelector('#main').innerHTML=`<div class="toolbar"><span class="tag">第${index+1}批 / ${D.batches.length}批</span><span class="tag">${b.references.length}张参考 · ${b.rows.length}个镜头</span></div><h1>${esc(b.title)}</h1><p class="notice">本次生成15秒；原片0–${n(b.used_seconds)}秒进入成片${n(b.film_start)}–${n(b.film_end)}秒。${b.handle_seconds?`${n(b.used_seconds)}–15秒为剪除余量。`:'全部15秒用于正片。'} ${D.audio_execution?`中文原意与镜序保留，${esc(speechLabel)}译配及卡点方案待审。`:"台词与源镜序保留，动态方案待审。"}</p>${dialoguePanel(b)}<p>${esc(b.arc)}</p><div class="two"><div class="bridge"><b>从前一批接入</b><p>${esc(b.entry_bridge)}</p></div><div class="bridge"><b>接向后一批</b><p>${esc(b.exit_bridge)}</p></div></div>
<h2>一次生成的参考素材包</h2>${b.models.seedance25.issues.some(x=>x.includes("缺少四视图"))?'<p class="notice issue">教主身份四视图待补；本批保留完整画面规划，未用立绘或概念图填充身份槽位。</p>':''}${b.references.length>9?`<p class="notice issue">本批完整素材包为${b.references.length}张。H3已核实容量为9张，本批已选Seedance模板保留完整参考；H3稿仅作对照，不用于本批提交。</p>`:''}<p class="muted">按下列顺序上传并绑定图片编号。人物四视图的多个角度是同一人物；分镜图提供构图与代表状态，不自动当作首帧。点图可查看原文件。</p><div class="grid">${b.references.map(r=>`<figure id="picture-${r.slot}"><a href="${url(r.path)}" target="_blank"><img loading="lazy" src="${url(r.path)}" alt="图片${r.slot} ${esc(r.purpose)}"></a><figcaption><b>图片${r.slot}</b> · ${esc(r.purpose)}<details><summary>素材状态与使用限制</summary><p>${esc(r.status)}</p><p>${esc(r.limits||'按本批起止状态表演，不把静帧当作整镜停止画面。')}</p></details></figcaption></figure>`).join('')}</div>
<h2>画面、人物与运镜时间线</h2><div class="scroll"><table><thead><tr><th>批内时间／参考</th><th>动作与人物</th><th>镜头与运镜</th><th>如何接上</th></tr></thead><tbody>${b.rows.map(r=>`<tr><td>${n(r.start)}–${n(r.end)}秒<br>${link(r.slot)}<p class="muted">${esc(r.title)}</p></td><td><p>${esc(r.action)}</p><small>画内：${esc(r.visible.join('、')||'环境／道具')}；画外：${esc(r.offscreen.join('、')||'无')}；倒影：${esc(r.reflection.join('、')||'无')}。${esc(r.cast_note)}</small>${r.execution?`<p class="muted">${esc(r.execution)}</p>`:''}</td><td><p>${esc(r.framing)}</p><p>${esc(r.camera)}</p></td><td>${esc(r.transition)}</td></tr>`).join('')}${b.handle_seconds?`<tr><td>${n(b.used_seconds)}–15秒</td><td colspan="3">延续末镜状态与自然微动，不加剧情、不重演动作；此段剪除。</td></tr>`:''}</tbody></table></div>
${audioPolicy()}${rhythmPanel(b)}<h2>完整提示词</h2><p class="notice">本批安排：${b.selected_model==='seedance25'?'Seedance 2.5':'MiniMax H3'}。${esc(b.selection_reason)}</p><div class="toolbar"><label for="model">模型</label><select id="model"><option value="seedance25">Seedance 2.5</option><option value="minimax-h3">MiniMax H3 · Ref2VA</option></select><button id="copy">复制本批可用提示词</button><a id="download" download>下载本批TXT</a><span id="copyStatus" role="status"></span></div><div id="modelStatus"></div><textarea id="prompt" readonly aria-label="完整生成提示词"></textarea>
<h2>环境音与后期交接</h2><details><summary>逐镜环境声与已选BGM</summary>${b.rows.map(r=>`<p>${link(r.slot)} · ${n(r.start)}–${n(r.end)}秒：${esc(r.effects)}<br><span class="music">成片${n(r.film_start)}–${n(r.film_end)}秒：${esc(musicLabel(r.bgm))}，曲目归属参考；实际进出与停乐以配乐卡点表和声音预览为准。${r.film_end===D.film_seconds?'最后4秒关闭BGM，只留街市和呼吸。':''}</span></p>`).join('')}</details>
<details><summary>全片声音与执行交接</summary><ul>${[...D.global_gaps,...D.mix_notes].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details><div class="toolbar endnav"><button id="previous" ${index===0?'disabled':''}>上一批</button><button id="next" ${index===D.batches.length-1?'disabled':''}>下一批</button><a href="结构核验.json">结构核验</a></div><p class="muted">参考数量、人物缺图和已知画面冲突会列在对应模型上方。结构核验通过不代表视频动态、声音或作者采用已经完成。</p>`;
let select=document.querySelector('#model');select.value=model;select.onchange=()=>{model=select.value;update();};
function update(){let m=b.models[model];document.querySelector('#copy').disabled=!m.capacity_ok;document.querySelector('#download').hidden=!m.capacity_ok;document.querySelector('#prompt').value=b.prompts[model];document.querySelector('#download').href='提示词/'+b.id+'-'+model+'.txt';document.querySelector('#copyStatus').textContent='';document.querySelector('#modelStatus').innerHTML=`<p class="muted">${m.image_count}张参考 / 文档容量${m.max_images}张 · ${m.chars}字符 · 15秒 / 16:9 · 实际入口参数提交前核实</p>`+(m.issues.length?`<div class="notice issue"><b>本批待处理项</b><ul>${m.issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'<p class="notice">已完成本批参考、动态与提示词编排；待作者审阅及实际入口核实。</p>');}
bindDialogue();update();document.querySelector('#copy').onclick=async()=>{if(!b.models[model].capacity_ok)return;try{await navigator.clipboard.writeText(b.prompts[model]);document.querySelector('#copyStatus').textContent='已复制';}catch(e){document.querySelector('#prompt').select();document.querySelector('#copyStatus').textContent='请按Ctrl+C复制';}};
document.querySelector('#previous').onclick=()=>choose(index-1);document.querySelector('#next').onclick=()=>choose(index+1);
document.querySelectorAll('[data-pic]').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector('#picture-'+a.dataset.pic).scrollIntoView({block:'center',behavior:'smooth'});});}
document.querySelector('#view-batch').onclick=()=>choose(index);document.querySelector('#view-dialogue').onclick=()=>{dialogueView=true;location.hash='dialogue';render();document.querySelector('#main').scrollIntoView({block:'start'});};document.querySelector('#search').oninput=()=>{nav();if(dialogueView)renderDialogueReading();};window.addEventListener('hashchange',()=>{if(location.hash==='#dialogue'){dialogueView=true;render();return;}let i=D.batches.findIndex(b=>b.id===location.hash.slice(1));if(i>=0&&(i!==index||dialogueView)){index=i;dialogueView=false;render();}});render();
</script><script>
const beforeAudioCard=dialogueCard;
dialogueCard=function(b,c,i){let card=beforeAudioCard(b,c,i),a=c.returned_audio;return card.slice(0,card.lastIndexOf('</article>'))+`<audio controls preload="none" style="width:100%" aria-label="${esc(roleName(c.speaker))}：${esc(c.text)}" src="${url(a.path)}"></audio><p class="muted">完整文件 ${dt(a.file_seconds)} 秒 · 原速对位 ${dt(a.budget_seconds)} 秒。${esc(a.note)}<a href="${url('后期/生成收口-v025/全片声音预览.html')}#t=${b.film_start+c.start}">连同画面试听本句</a></p></article>`;};
document.querySelector('header').insertAdjacentHTML('beforeend',`<p class="notice">已按自然原声修复时间，共63句。<a href="${url('后期/生成收口-v025/全片声音预览.html')}">打开全片声音与画面预览</a>。后期日语时间字幕：${D.post_captions.map(c=>dt(c.start)+'秒「'+c.ja+'」').join('、')}，各2秒。</p>`);render();
</script></body></html>
