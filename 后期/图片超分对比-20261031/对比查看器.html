<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>白米饭 · 图片超分对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101824;color:#e8edf5;font:15px system-ui,"Microsoft YaHei",sans-serif}header{padding:22px 28px;background:#172231}h1{font-size:23px;margin:0 0 10px}p{line-height:1.65;color:#b7c5d8;margin:8px 0}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px 28px;background:#203047;position:sticky;top:0;z-index:5}select,button{background:#101824;color:#fff;border:1px solid #667a94;border-radius:6px;padding:8px}label{display:flex;gap:8px;align-items:center}input{width:220px}#viewport{overflow:auto;max-height:75vh;margin:20px 28px;border:1px solid #44556c}#stage{position:relative;width:100%;line-height:0}#stage img{width:100%;height:auto;display:block}#over{position:absolute;left:0;top:0;clip-path:inset(0 50% 0 0)}#line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}.tag{position:absolute;top:15px;background:#000b;padding:10px;border-radius:4px;line-height:1.3;pointer-events:none}#tagA{left:15px}#tagB{right:15px}section{padding:8px 28px 24px}a{color:#9fd5ff}#crops{display:grid;gap:18px}#crops img{display:block;width:100%;max-width:1600px}small{color:#aebfd4}
</style>
<header><h1>白米饭 · 原图 / 常规超分 / SeedVR2 / RTX</h1><p>同一张输入，统一长边 3840。拖动分界线比较左右结果；切换「100%」后滚动查看原生像素。原图列采用 Lanczos 放大作为基线。</p><p>保留原画优先：RTX 可先用；更干净的动漫线条：Real-ESRGAN；SeedVR2 会补画细节，需逐图审查。仅为本次三张样本的观察。</p></header>
<div class="controls">
<label>样本<select id="sample"><option value="closeup">人物近景</option><option value="fullbody">全身服装母版</option><option value="palace">宫殿</option></select></label>
<label>左<select id="a"></select></label><label>右<select id="b"></select></label>
<label>分界<input id="split" type="range" min="0" max="100" value="50"></label><button id="zoom">100%</button><span id="dims"></span>
</div>
<div id="viewport"><div id="stage"><img id="base" alt="右侧方法"><img id="over" alt="左侧方法"><div id="line"></div><div class="tag" id="tagA"></div><div class="tag" id="tagB"></div></div></div>
<section><p id="links"></p><p>以下为相同坐标的局部对比。每列顺序固定：原图（Lanczos）、Real-ESRGAN、SeedVR2、RTX。图片文件未缩放裁切像素；页面会按窗口缩小，点击可打开原尺寸。</p><div id="crops"></div><p><a href="实验记录.md">实验记录与参数</a> · <a href="samples.json">原件路径与 SHA-256</a> · <a href="results.json">运行结果</a></p></section>
<script>
const $=id=>document.getElementById(id),methods={original:'原图 · Lanczos',realesrgan:'Real-ESRGAN',seedvr2:'SeedVR2 · 7B Q8',rtx:'RTX · ULTRA'},regions={closeup:['face','hands','hair'],fullbody:['face','clothes','text'],palace:['throne','ornament','floor']};
for(const id of ['a','b'])for(const [v,t] of Object.entries(methods))$(id).add(new Option(t,v));$('a').value='original';$('b').value='rtx';
let native=false;
const path=(s,m)=>m==='original'?`baselines/${s}_original_lanczos.png`:`outputs/${s}_${m}.png`;
function divider(){$('over').style.clipPath=`inset(0 ${100-$('split').value}% 0 0)`;$('line').style.left=$('split').value+'%'}
function render(){const s=$('sample').value;$('base').src=path(s,$('b').value);$('over').src=path(s,$('a').value);$('tagA').textContent=methods[$('a').value];$('tagB').textContent=methods[$('b').value];$('dims').textContent=s==='fullbody'?'3840 × 1646':'3840 × 2162';$('links').innerHTML=Object.entries(methods).map(([m,t])=>`<a target="_blank" href="${path(s,m)}">${t} 完整图</a>`).join(' · ');$('crops').innerHTML=regions[s].map(r=>`<a target="_blank" href="comparisons/${s}_${r}.png"><img alt="${s} ${r} 四列局部对比" src="comparisons/${s}_${r}.png"></a>`).join('');divider()}
for(const id of ['sample','a','b'])$(id).onchange=render;$('split').oninput=divider;$('zoom').onclick=()=>{native=!native;$('stage').style.width=native?'3840px':'100%';$('zoom').textContent=native?'适应窗口':'100%'};render();
</script></html>
